name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src scripts tests

      - name: Run release checks
        run: python -m pytest tests/ -q

      - name: Check command-line entry points
        run: |
          python scripts/run_benchmarks.py --help > /dev/null
          python scripts/run_probing.py --help > /dev/null
          python scripts/run_intervention.py --help > /dev/null

  pinned:
    name: Pinned versions (requirements.txt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Run release checks
        run: python -m pytest tests/ -q

  figures:
    name: Figures rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Rebuild paper figures from cached aggregates
        run: make figures

      - uses: actions/upload-artifact@v4
        with:
          name: paper-figures
          path: figures/*.pdf
          if-no-files-found: error
