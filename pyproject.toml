[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biaseval"
version = "1.0.0"
description = "Stereotypical-bias evaluation for causal LMs: benchmarks, probes, and concept-erasure interventions"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [
    {name = "Sigurd Kornelius Havstein", email = "qjp403@alumni.ku.dk"},
    {name = "Anders Søgaard"},
]

dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "datasets>=2.16",
    "huggingface-hub>=0.20",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.27",
    "bitsandbytes>=0.42",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
]
tracking = [
    "wandb>=0.16",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/korneli777/alignment-bias-eval"
Issues = "https://github.com/korneli777/alignment-bias-eval/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # pep8-naming
    "RUF",           # ruff-specific
]
ignore = [
    "E501",   # line length is handled by the formatter
    "N803",   # X, y are the sklearn convention for arguments
    "N806",   # ...and for locals
    "RUF001", # x / - / - are intentional in log and table output
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
